    var m = currentMode();
    if (m === "overlay") state.sheetOpen = true; else state.panelOpen = true;
    applyMode();
    var tog = document.querySelector("#parent .parent-toggle");
    if (m === "stack" && tog) tog.scrollIntoView({ block: "start" });
    if (tog) setTimeout(function () { tog.focus({ preventScroll: m !== "stack" }); }, 50);
  }
  function closeGuide() {
    var m = currentMode();
    if (m === "overlay") state.sheetOpen = false; else if (m === "docked") state.panelOpen = false;
    applyMode();
    var g = document.querySelector("#layout .guide-btn"); if (g) g.focus({ preventScroll: true });
  }
  mqLand.addEventListener ? mqLand.addEventListener("change", applyMode) : mqLand.addListener(applyMode);
  mqWide.addEventListener ? mqWide.addEventListener("change", applyMode) : mqWide.addListener(applyMode);
  function onFsChange() { if (!fsEl()) resetOverlays(); applyMode(); }
  document.addEventListener("fullscreenchange", onFsChange);
  document.addEventListener("webkitfullscreenchange", onFsChange);

  function renderPrint() {
    app.innerHTML = topbar(state.fromSec === null ? "home" : "back-sec") +
      '<main><div class="print-tools no-print"><div class="section-head"><h2 style="font-size:28px">' + esc(V.printTitle) + '</h2><p>1 lembar A4, 6 kartu. Gunting di garis putus-putus.</p></div>' +
      '<div class="note"><b>Cara mencetak</b><ol class="print-steps"><li>Laptop: tekan <kbd>Ctrl</kbd> + <kbd>P</kbd> (Windows) atau <kbd>Cmd</kbd> + <kbd>P</kbd> (Mac).</li><li>HP atau tablet: buka menu browser (⋮ atau tombol Bagikan), lalu pilih <b>Cetak</b>.</li><li>Pilih kertas A4. Pilih printer, atau <b>Simpan sebagai PDF</b> untuk dicetak nanti.</li><li>Gunting kartu di garis putus-putus.</li></ol></div></div>' +
      '<div class="sheet-scroll"><article class="sheet" aria-label="Lembar flashcard A4"><div class="sheet-head"><b>Show &amp; Tell · Vol. ' + curVol + '</b><span>Teach with Bibo · ' + esc(V.printTitle) + "</span></div>" +
      '<div class="sheet-grid">' + V.printCards.map(function (c) {
        return '<div class="bb-wordcard bb-wordcard--print"><div class="bb-wordcard__img">' + cardImg(c, "ph--bone") + '</div><p class="bb-wordcard__word" lang="en">' + c.w + "</p></div>";
      }).join("") + '</div></article></div><p class="scissors no-print" style="margin-top:12px">✂ Garis putus-putus = garis potong</p></main>';
  }

  /* ---------- Activity book ---------- */
  function wsSheet(w, k) {
    var n = V.worksheets.length;
    return '<article class="ws-sheet' + (w.src ? " has-art" : "") + '" aria-label="Lembar kerja ' + (k + 1) + '">' +
      '<div class="ws-head"><span class="ws-vol">Vol. ' + curVol + '</span><span class="ws-title" lang="en">' + esc(V.bigQ.en) + '</span><span class="ws-name">Name: <span></span></span></div>' +
      '<p class="ws-instr"><span class="n">' + (k + 1) + '</span><span class="en" lang="en">' + esc(w.en) + '</span><span class="id">' + esc(w.id) + "</span></p>" +
      '<div class="ws-art">' + (w.src ? '<img src="' + w.src + '" alt="' + esc(w.alt || w.label) + '" decoding="async">' : '<p class="ws-ph">[Gambar lembar kerja: ' + esc(w.label) + "]</p>") + "</div>" +
      '<div class="ws-foot"><span>Teach with Bibo · Show &amp; Tell · Activity book</span><span>Setelah bagian ' + SECTIONS[w.sec].letter + " · Lembar " + (k + 1) + " dari " + n + "</span></div></article>";
  }
  function wsGuide(w, k) {
    return '<div class="ws-guide no-print"><h3>Lembar ' + (k + 1) + ": " + esc(w.name) + '</h3><p><b>Tujuan:</b> ' + esc(w.goal) + "</p>" +
      pblock("Cara memakai", "<ol>" + w.steps.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ol>") +
      pblock("Skrip", '<div class="scripts">' + w.say.map(function (x) { return script(x[0], x[1]); }).join("") + "</div>") + "</div>";
  }
  function setPageSize(landscape) {
    var el = document.getElementById("page-size");
    if (!el) { el = document.createElement("style"); el.id = "page-size"; document.body.appendChild(el); }
    el.textContent = "@media print { @page { size: A4" + (landscape ? " landscape" : "") + "; margin: 10mm; } }";
  }
  function renderWorksheets(only) {
    var list = only === null || only === undefined ? V.worksheets.map(function (w, k) { return k; }) : [only];
    app.innerHTML = topbar(state.fromSec === null ? "home" : "back-sec") +
      '<main><div class="print-tools no-print"><div class="section-head"><h2 style="font-size:28px">Activity book' + (list.length === 1 ? " · Lembar " + (list[0] + 1) : "") + '</h2><p>' + (list.length === 1 ? esc(V.worksheets[list[0]].name) + ". 1 lembar A4 landscape, hitam-putih." : list.length + " lembar A4 landscape, hitam-putih, hemat tinta. Tiap lembar tercetak di halaman sendiri.") + "</p></div>" +
      '<div class="note"><b>Cara mencetak</b><ol class="print-steps"><li>Laptop: tekan <kbd>Ctrl</kbd> + <kbd>P</kbd> (Windows) atau <kbd>Cmd</kbd> + <kbd>P</kbd> (Mac).</li><li>HP atau tablet: buka menu browser (⋮ atau tombol Bagikan), lalu pilih <b>Cetak</b>.</li><li>Pilih kertas A4, orientasi <b>Landscape</b>, dan warna <b>Hitam-putih</b>.</li><li>Panduan orang tua di layar ini tidak ikut tercetak.</li></ol></div>' +
      (list.length === 1 ? '<div class="ab-actions"><button type="button" class="bb-btn bb-btn--secondary" data-action="ws-all">Lihat semua lembar kerja</button></div>' : "") + "</div>" +
      '<div class="ws-list">' + list.map(function (k) { var w = V.worksheets[k]; return '<section class="ws-item">' + wsGuide(w, k) + '<div class="sheet-scroll">' + wsSheet(w, k) + "</div></section>"; }).join("") + "</div></main>";
  }
  function wsCta(i) {
    var k = -1; (V.worksheets || []).forEach(function (w, j) { if (w.sec === i) k = j; });
    if (k < 0) return "";
    var w = V.worksheets[k];
    return '<div class="print-cta"><p><b>Activity book, lembar ' + (k + 1) + ':</b> <span lang="en">' + esc(w.en) + "</span> " + esc(w.name) + ". Kerjakan setelah bagian ini selesai.</p>" +
      '<button type="button" class="bb-btn bb-btn--secondary" data-action="ws" data-ws="' + k + '">Cetak lembar kerja</button></div>';
  }

  function go(view, opts) {
    opts = opts || {};
    stopSpeech();
    var wasFs = !!fsEl();
    resetOverlays();
    if (wasFs) exitFs();
    state.view = view; state.sheetOpen = false;
    app.className = "wrap" + (view === "section" ? " wide" : "");
    if (view === "section") { state.sec = opts.sec; state.slide = 0; game = null; builder = null; }
    if (view === "access") renderAccess(opts);
    else if (view === "library") renderLibrary();
    else if (view === "home") renderHome();
    else if (view === "section") renderSection();
    else if (view === "print") renderPrint();
    else if (view === "worksheets") renderWorksheets(opts.ws);
    setPageSize(view === "worksheets");
    applyMode();
    window.scrollTo(0, 0);
    var h = app.querySelector("h1, h2"); if (h && view !== "access") { h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); }
  }

  /* ---------- Perayaan ---------- */
  function celebrate() {
    var c = document.getElementById("celebrate");
    var host = overlayHost(); if (c.parentNode !== host) host.appendChild(c);
    c.innerHTML = '<div class="celebrate-card">' + biboImg("jump-up", "", "Bibo melompat gembira") + '<h2 id="cel-title">Hebat!</h2><p>Proyek Show &amp; Tell selesai. Kasih tepuk tangan yang meriah!</p>' + audioBtn("Great job! You did it!") + '<button type="button" class="bb-btn" data-action="close-cel">Tutup</button></div>';
    c.hidden = false;
    speak("Great job! You did it!");
    var b = c.querySelector('[data-action="close-cel"]'); if (b) b.focus();
  }

  /* ---------- Efek suara klik (file audio/click.mp3, diputar lewat Web Audio agar cepat). Tidak dipakai untuk tombol yang memutar audio. ---------- */
  var sfxCtx = null, sfxBuf = null, sfxLoading = false;
  function loadClickSfx() {
    if (sfxBuf || sfxLoading || !sfxCtx) return;
    sfxLoading = true;
    fetch("audio/click.mp3").then(function (r) { if (!r.ok) throw new Error("no click"); return r.arrayBuffer(); })
      .then(function (ab) { return new Promise(function (res, rej) { sfxCtx.decodeAudioData(ab, res, rej); }); })
      .then(function (buf) { sfxBuf = buf; })
      .catch(function () { sfxLoading = false; });
  }
  function clickSfx() {
    try {
      var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      if (!sfxCtx) sfxCtx = new AC();
      if (sfxCtx.state === "suspended") sfxCtx.resume();
      if (!sfxBuf) { loadClickSfx(); return; }
      var src = sfxCtx.createBufferSource(), g = sfxCtx.createGain();
      src.buffer = sfxBuf; g.gain.value = 0.6;
      src.connect(g); g.connect(sfxCtx.destination); src.start();
    } catch (e) {}
  }
  document.addEventListener("pointerdown", function once() {
    try { var AC = window.AudioContext || window.webkitAudioContext; if (AC && !sfxCtx) sfxCtx = new AC(); loadClickSfx(); } catch (e) {}
    document.removeEventListener("pointerdown", once, true);
  }, true);
  document.addEventListener("click", function (e) {
    var t = e.target.closest("button, a.video, label");
    if (!t || t.disabled) return;
    if (t.matches("[data-say], .bb-audio")) return;
    clickSfx();
  }, true);

  /* ---------- Event ---------- */
  function fval(id) { var i = document.getElementById(id); return i ? i.value : ""; }
  document.addEventListener("submit", function (e) {
    var f = e.target, id = f.id;
    if (!/^f-/.test(id)) return;
    e.preventDefault();
    if (f.getAttribute("data-busy")) return;
    var btn = f.querySelector('button[type="submit"]'), label = btn ? btn.innerHTML : "";
    f.setAttribute("data-busy", "1"); if (btn) { btn.disabled = true; btn.innerHTML = "Sebentar…"; }
    function done() { f.removeAttribute("data-busy"); if (btn) { btn.disabled = false; btn.innerHTML = label; } }
    function fail(err) {
      done();
      if (SESSION_RE.test(err.message) && readSession()) { signOut(err.message); return; }
      var p = f.querySelector(".error");
      if (!p) { p = document.createElement("p"); p.className = "error"; p.setAttribute("role", "alert"); f.insertBefore(p, btn); }
      p.textContent = err.message;
    }
    var s = readSession();
    if (id === "f-code") {
      var code = fval("code").trim();
      if (!code) { fail(new Error("Masukkan kode pembelian dulu.")); return; }
      api("checkCode", code).then(function (r) { done(); accDraft.code = code; accDraft.label = r.label; go("access", { mode: "register" }); }, fail);
    } else if (id === "f-register") {
      api("activate", accDraft.code, fval("username"), fval("password"), fval("email"), deviceLabel()).then(function (r) {
        done(); signedIn(r); accDraft = { code: "", label: "", username: "" }; go("library"); toast("Akun dibuat. Selamat belajar bersama Bibo!");
      }, fail);
    } else if (id === "f-login") {
      accDraft.username = fval("username").trim();
      api("login", fval("username"), fval("password"), deviceLabel()).then(function (r) { done(); signedIn(r); go("library"); }, fail);
    } else if (id === "f-forgot") {
      accDraft.username = fval("username").trim();
      api("requestReset", fval("username"), fval("email")).then(function (r) { done(); go("access", { mode: "reset", info: r.message }); }, fail);
    } else if (id === "f-reset") {
      api("confirmReset", accDraft.username, fval("otp"), fval("password"), deviceLabel()).then(function (r) { done(); signedIn(r); go("library"); toast("Password baru tersimpan."); }, fail);
    } else if (id === "f-redeem") {
      api("redeemCode", s && s.token, fval("newcode")).then(function (r) {
        done(); var cur = readSession(); if (cur) { cur.vols = r.user.vols; saveSession(cur); }
        closeCel(); go("library"); toast("Terbuka: Vol. " + r.added.join(", ") + ".");
      }, fail);
    } else if (id === "f-pass") {
      api("changePassword", s && s.token, fval("curpass"), fval("newpass")).then(function () { done(); closeCel(); toast("Password sudah diganti."); }, fail);
    }
  });

  document.addEventListener("click", function (e) {
    var t = e.target.closest("button, [data-action]"); if (!t) return;
    if (t.hasAttribute("data-say")) {
      speak(t.getAttribute("data-say"), t);
      var w = t.getAttribute("data-word");
      if (w) {
        t.classList.add("heard");
        var f = V.core.filter(function (x) { return x.w === w; })[0], r = document.getElementById("reveal");
        if (f && r) r.innerHTML = '<div class="reveal' + (f.say.length > 18 || f.w.length > 9 ? " reveal--long" : "") + '">' + wordCard(f) + '<div class="info"><p class="id">' + esc(f.w) + " = " + esc(f.id) + "</p>" +
          kidLine(f.say, f.sayId) + "</div></div>";
      }
      return;
    }
    if (t.hasAttribute("data-sec")) { go("section", { sec: Number(t.getAttribute("data-sec")) }); return; }
    if (t.hasAttribute("data-pick")) { pick(t); return; }
    if (t.classList.contains("bubble")) { playLine(t); return; }
    if (t.hasAttribute("data-chip")) { tapChip(t); return; }
    if (t.hasAttribute("data-mside")) { tapMatch(t); return; }
    var a = t.getAttribute("data-action");
    if (t.hasAttribute("data-acc")) { go("access", { mode: t.getAttribute("data-acc") }); return; }
    if (t.classList.contains("vol-card")) {
      var vn = Number(t.getAttribute("data-vol")), vv = VOLUMES[vn - 1];
      if (!canOpen(vn)) showLocked(vn);
      else if (vv.ready) { openVolume(vn); go("home"); }
      else toast("Vol. " + vn + " sedang disiapkan. Volume ini akan otomatis terbuka saat rilis.");
      return;
    }
    if (a === "home") go("home");
    else if (a === "library") go("library");
    else if (a === "buy-one" || a === "buy-all") toast("Tautan pembelian belum dipasang di prototipe ini.");
    else if (a === "install") showInstall();
    else if (a === "logout") signOut();
    else if (a === "account") showAccount();
    else if (a === "prev") {
      if (state.slide > 0) { state.slide--; renderSlide(true); }
      else if (state.sec > 0) {
        var target = state.sec - 1, lastS = SECTIONS[target].slides.length - 1;
        if (fsEl()) { state.sec = target; state.slide = lastS; game = null; builder = null; state.sheetOpen = false; renderSectionInPlace(); }
        else { go("section", { sec: target }); state.slide = lastS; renderSlide(false); }
      }
    }
    else if (a === "next") {
      if (state.slide < SECTIONS[state.sec].slides.length - 1) { state.slide++; renderSlide(true); }
      else if (state.sec < 5) {
        var stayFs = fsEl();
        if (stayFs) { state.sec++; state.slide = 0; game = null; builder = null; state.sheetOpen = false; renderSectionInPlace(); }
        else go("section", { sec: state.sec + 1 });
      } else go("home");
    }
    else if (a === "toggle-panel") {
      var m = currentMode();
      if (m === "stack") { state.panelOpen = !state.panelOpen; applyMode(); }
      else closeGuide();
    }
    else if (a === "open-guide") openGuide();
    else if (a === "close-guide") closeGuide();
    else if (a === "fullscreen") { if (fsEl()) exitFs(); else { var L = document.getElementById("layout"); if (L) enterFs(L); } }
    else if (a === "print") { state.fromSec = state.view === "section" ? state.sec : null; go("print"); }
    else if (a === "ws") { if (state.view === "section") state.fromSec = state.sec; else if (state.view === "home") state.fromSec = null; go("worksheets", { ws: Number(t.getAttribute("data-ws")) }); }
    else if (a === "ws-all") { if (state.view === "home") state.fromSec = null; go("worksheets", { ws: null }); }
    else if (a === "back-sec") { var dd = state.fromSec; state.fromSec = null; go("section", { sec: dd }); }
    else if (a === "story-all") revealAll(Number(t.getAttribute("data-story")));
    else if (a === "replay") { newGame(); renderGame(); }
    else if (a === "builder-next") { builder.i++; builder.placed = 0; builder.chips = null; renderBuilder(); }
    else if (a === "match-reset") { newMatch(); renderMatch(); }
    else if (a === "builder-reset") { builder = { i: 0, placed: 0, order: shuffle(V.sentences.map(function (x, k) { return k; })) }; renderBuilder(); }
    else if (a === "finish") celebrate();
    else if (a === "close-cel") { document.getElementById("celebrate").hidden = true; document.getElementById("celebrate").setAttribute("aria-labelledby", "cel-title"); stopSpeech(); }
  });

  /* Pindah ke bagian berikutnya tanpa keluar dari layar penuh: elemen layar penuh tetap, isinya diganti */
  function renderSectionInPlace() {
    stopSpeech();
    resetOverlays();
    var L = document.getElementById("layout");
    if (!L) { renderSection(); return; }
    var head = app.querySelector(".day-head");
    if (head) head.outerHTML = sectionHead(state.sec);
    var keep = [document.getElementById("toast"), document.getElementById("celebrate")];
    L.innerHTML = layoutInner(state.sec);
    keep.forEach(function (el) { if (el && !el.parentNode) document.body.appendChild(el); });
    applyMode();
    renderSlide(true);
  }

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    var c = document.getElementById("celebrate");
    if (!c.hidden) { c.hidden = true; return; }
    if (state.view === "section" && currentMode() === "overlay" && state.sheetOpen) closeGuide();
  });

  /* ---------- Mulai ---------- */
  openVolume(1);
  try { window.localStorage.removeItem("twb_code"); } catch (e) {}
  var sess0 = readSession();
  access = sess0 ? accessFrom(sess0) : null;
  if (access) { go("library"); syncAccount(); } else go("access");
})();
</script>

</body></html>
