<style>
/* Layout: tablet/laptop utama. >=900px: slide 16:9 kiri + panel orang tua kanan (360px). HP landscape & layar penuh: slide memenuhi tinggi, panel jadi lembar geser. HP tegak: bertumpuk. Isi slide diskalakan dengan container query units (cqw). Satu tema terang sesuai design system. */
:root {
  color-scheme: light;
  --sunshine: #ffc93c; --sunshine-soft: #ffe7a3;
  --bibo-blue: #277bc0; --bibo-blue-deep: #1b5a90; --sky: #86e5ff;
  --terracotta: #c95c3f; --terracotta-deep: #a8462c;
  --bone: #eae8e5; --cream: #fff8ea; --paper: #ffffff;
  --ink: #1e1b18; --ink-muted: #5a534c; --line: #d9d4cc; --cut-line: #8a8279; --leaf: #2e7d3e;
  --ph-blue: #dcebf7; --ph-clay: #f6e0d8; --scrim: rgba(30, 27, 24, 0.55);
  --font-display: "Lilita One", "Baloo 2", system-ui, sans-serif;
  --font-reader: "Andika", "Nunito", system-ui, sans-serif;
  --font-ui: "Nunito", system-ui, sans-serif;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-6: 24px; --space-8: 32px; --space-12: 48px;
  --radius-sm: 10px; --radius-md: 16px; --radius-lg: 24px; --radius-xl: 36px; --radius-round: 999px;
  --tap-kid: 64px; --tap-parent: 48px;
  --shadow-lift: 0 4px 0 rgba(30, 27, 24, 0.12);
  --panel-w: 360px;
}
* { box-sizing: border-box; }
body {
  background: var(--cream); color: var(--ink);
  font-family: var(--font-ui); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 var(--space-12);
}
.wrap { max-width: 880px; margin: 0 auto; }
.wrap.wide { max-width: 1440px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--bibo-blue-deep); outline-offset: 3px; }
/* Judul dan slide difokuskan oleh skrip (untuk pembaca layar) setelah pindah halaman; jangan tampilkan garis fokusnya */
[tabindex="-1"]:focus, [tabindex="-1"]:focus-visible { outline: none; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- Komponen dari design system ---------- */
.bb-label { display: inline-flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-4); background: var(--bone); color: var(--terracotta); border-radius: var(--radius-md); font-family: var(--font-display); font-size: 24px; line-height: 1.15; }
.bb-label--ink { color: var(--ink); }
.bb-audio { display: inline-grid; place-items: center; flex: none; width: var(--tap-kid); height: var(--tap-kid); border-radius: var(--radius-round); background: var(--bibo-blue-deep); color: var(--paper); border: 4px solid var(--bone); box-shadow: var(--shadow-lift); cursor: pointer; padding: 0; }
.bb-audio svg { width: 40%; height: 40%; margin-left: 8%; fill: currentColor; }
.bb-audio:active { transform: translateY(4px); box-shadow: none; }
.bb-audio--sm { width: var(--tap-parent); height: var(--tap-parent); border-width: 3px; }
.bb-audio--xl { width: 96px; height: 96px; border-width: 6px; }
.bb-audio[aria-pressed="true"] { background: var(--bibo-blue); }
.bb-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); min-height: var(--tap-parent); padding: 0 var(--space-6); border-radius: var(--radius-round); border: 0; cursor: pointer; font-family: var(--font-ui); font-weight: 800; font-size: 16px; background: var(--bibo-blue-deep); color: var(--paper); box-shadow: var(--shadow-lift); text-decoration: none; }
.bb-btn:active { transform: translateY(4px); box-shadow: none; }
.bb-btn--secondary { background: var(--paper); color: var(--bibo-blue-deep); box-shadow: inset 0 0 0 2px var(--bibo-blue-deep); }
.bb-btn--kid { min-height: var(--tap-kid); font-family: var(--font-display); font-weight: 400; font-size: 24px; }
.bb-btn--small { min-height: 40px; padding: 0 var(--space-4); font-size: 14px; }
.bb-btn:disabled { background: var(--line); color: var(--ink-muted); box-shadow: none; cursor: default; }
.bb-wordcard { display: grid; grid-template-rows: auto auto; gap: var(--space-3); width: 100%; padding: var(--space-3) var(--space-3) var(--space-4); background: var(--sunshine); border-radius: var(--radius-lg); box-shadow: var(--shadow-lift); border: 0; font: inherit; color: inherit; text-align: center; }
button.bb-wordcard { cursor: pointer; min-height: var(--tap-kid); }
.bb-wordcard__img { aspect-ratio: 1; max-width: 100%; background: var(--paper); border-radius: var(--radius-md); display: grid; place-items: center; overflow: hidden; padding: var(--space-2); }
.bb-wordcard__word { margin: 0; text-align: center; color: var(--ink); font-family: var(--font-reader); font-weight: 700; font-size: 32px; line-height: 1.1; }
.bb-wordcard--print { box-shadow: none; outline: 2px dashed var(--cut-line); outline-offset: 6px; }
.bb-wordcard.is-correct { box-shadow: 0 0 0 5px var(--leaf); }
.bb-wordcard.is-retry { box-shadow: 0 0 0 5px var(--terracotta-deep); }
.bb-script { display: grid; grid-template-columns: auto 1fr; gap: var(--space-2) var(--space-3); align-items: center; padding: var(--space-4); background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-lg); }
.bb-script > div { min-width: 0; }
.bb-script__en { margin: 0; font-weight: 700; font-size: 18px; line-height: 1.45; color: var(--ink); }
.bb-script__id { margin: 0; font-weight: 600; font-size: 14px; line-height: 1.4; color: var(--ink-muted); }
.bb-script__note { grid-column: 1 / -1; margin: 0; padding-top: var(--space-2); border-top: 1px solid var(--line); font-size: 14px; line-height: 1.4; color: var(--ink-muted); }
.bb-script__note strong { color: var(--terracotta-deep); }

/* ---------- Placeholder gambar ---------- */
.ph { display: grid; place-items: center; width: 100%; max-width: 100%; border-radius: var(--radius-md); background: var(--sunshine-soft); color: var(--ink-muted); font-weight: 700; font-size: 13px; line-height: 1.3; text-align: center; padding: var(--space-2); }
.ph--blue { background: var(--ph-blue); }
.ph-fill { border-radius: 0; font-size: max(12px, 1.4cqw); padding: var(--space-4); }
.scene-pic > .ph-fill { place-items: end center; }
.story-pic > .ph-fill { place-items: center; padding: 18% 20%; }
.show-pic .ph-fill, .project-pic .ph-fill { border-radius: max(20px, 2.4cqw); }
.spot--ph { background: rgba(255, 255, 255, 0.55); box-shadow: inset 0 0 0 2px var(--ink-muted); border-radius: max(10px, 1cqw); display: grid; place-items: center; }
.spot--ph .spot-label { font-family: var(--font-reader); font-weight: 700; font-size: max(12px, 1.5cqw); color: var(--ink); }
.m-ph { display: grid; place-items: center; border-radius: 10px; background: var(--sunshine-soft); color: var(--ink); font-family: var(--font-reader); font-weight: 700; font-size: max(11px, 1.3cqw); text-align: center; line-height: 1.1; }
.m-ph--sil { background: var(--ink); color: var(--paper); font-size: max(20px, 3cqw); }
.video--ph { cursor: default; } .ph--clay { background: var(--ph-clay); } .ph--bone { background: var(--bone); }
.bb-wordcard__img .ph { height: 100%; }
.bb-wordcard__img { position: relative; }
.bb-wordcard__img .char-img { position: absolute; top: 8px; left: 8px; width: calc(100% - 16px); height: calc(100% - 16px); object-fit: contain; }
.bibo-fallback { display: grid; place-items: center; width: 120px; height: 120px; border-radius: 50%; background: var(--bibo-blue); color: var(--paper); font-family: var(--font-display); font-size: 28px; }
.bibo { display: block; width: 120px; height: auto; max-width: 100%; }
.bibo-panel { width: 44px; flex: none; }
.bibo-mini { display: inline-block; width: 30px; vertical-align: middle; margin-right: var(--space-2); }
.cover-head { display: flex; justify-content: space-between; align-items: flex-end; gap: var(--space-4); }
.cover-head > div { min-width: 0; }
.bibo-cover { width: clamp(88px, 22vw, 150px); flex: none; }
.with-bibo { display: grid; grid-template-columns: minmax(0, 1fr); gap: max(12px, 1.4cqw); }
.with-bibo .bibo-side { width: 72px; justify-self: start; }
.wb-main { display: grid; grid-template-columns: minmax(0, 1fr); gap: max(16px, 1.8cqw); min-width: 0; align-content: safe center; }
.point-row { display: flex; align-items: center; gap: max(8px, 1cqw); }
.point-row .bibo-point { width: max(80px, 10cqw); flex: none; }
.point-row .kid-q { min-width: 0; }

/* ---------- Bar atas ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--cream); display: flex; align-items: center; gap: var(--space-3); padding-block: var(--space-3); border-bottom: 1px solid var(--line); margin-bottom: var(--space-6); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--cream); }
.brand { font-family: var(--font-display); font-size: 20px; color: var(--bibo-blue-deep); line-height: 1.1; }
.brand small { display: block; font-family: var(--font-ui); font-weight: 700; font-size: 13px; color: var(--ink-muted); }
.topbar .spacer { flex: 1; }
.icon-btn { display: inline-grid; place-items: center; width: var(--tap-parent); height: var(--tap-parent); border-radius: var(--radius-round); border: 2px solid var(--bibo-blue-deep); background: var(--paper); color: var(--bibo-blue-deep); cursor: pointer; flex: none; }
.icon-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.link-btn { background: none; border: 0; color: var(--bibo-blue-deep); font: inherit; font-weight: 800; text-decoration: underline; cursor: pointer; min-height: var(--tap-parent); padding: 0 var(--space-2); }

/* ---------- Layar kode akses ---------- */
.access { min-height: 100%; display: grid; place-items: center; padding-block: var(--space-12); }
.access-card { width: 100%; max-width: 440px; display: grid; gap: var(--space-6); justify-items: center; text-align: center; }
.access-cover { width: 100%; background: var(--sunshine); border-radius: var(--radius-xl); padding: var(--space-8) var(--space-6) var(--space-6); display: grid; gap: var(--space-2); justify-items: center; }
.access-cover .tiny { font-family: var(--font-display); font-size: 18px; color: var(--bibo-blue-deep); }
.access-cover h1 { font-size: 48px; line-height: 1; color: var(--ink); }
.access-cover .vol { font-weight: 800; color: var(--ink); }
.field { width: 100%; display: grid; gap: var(--space-2); text-align: left; }
.field label { font-weight: 800; }
.field input { min-height: var(--tap-parent); border-radius: var(--radius-sm); border: 2px solid var(--line); background: var(--paper); padding: 0 var(--space-4); font: inherit; font-size: 18px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink); }
.field input:focus-visible { border-color: var(--bibo-blue-deep); }
.hint { font-size: 14px; color: var(--ink-muted); }
.error { font-size: 14px; font-weight: 700; color: var(--terracotta-deep); }
.access-card .bb-btn { width: 100%; }
.field input.plain { text-transform: none; letter-spacing: 0; font-weight: 600; }
.acc-form { width: 100%; display: grid; gap: var(--space-4); text-align: left; }
.acc-form h2 { font-size: 26px; line-height: 1.15; }
.acc-form h3 { font-size: 18px; }
.acc-form .bb-btn { width: 100%; }
.acc-alt { font-size: 15px; }
.acc-ok { background: var(--sunshine-soft); border-radius: var(--radius-sm); padding: var(--space-2) var(--space-3); }
.info-note { font-size: 14px; font-weight: 700; color: var(--bibo-blue-deep); }
.acct-who { display: grid; gap: 2px; }
.acct-who span { color: var(--ink-muted); font-weight: 700; font-size: 14px; }
.acct-more summary { cursor: pointer; font-weight: 800; min-height: var(--tap-parent); display: flex; align-items: center; }

/* ---------- Kode contoh di layar masuk ---------- */
.demo-codes { width: 100%; display: grid; gap: var(--space-2); text-align: left; }
.demo-row { display: flex; gap: var(--space-2); flex-wrap: wrap; }
.chip-code { display: grid; text-align: left; min-height: var(--tap-parent); padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm); border: 2px dashed var(--line); background: var(--paper); font: inherit; font-weight: 800; letter-spacing: 0.04em; color: var(--ink); cursor: pointer; }
.chip-code small { font-weight: 600; letter-spacing: 0; color: var(--ink-muted); font-size: 12px; }

/* ---------- Perpustakaan volume ---------- */
.lib-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--space-4); }
.lib-title .series { font-family: var(--font-display); font-size: 16px; color: var(--bibo-blue-deep); }
.lib-title h1 { font-size: 44px; line-height: 1; }
.lib-title .sub { font-weight: 700; color: var(--ink-muted); margin-top: var(--space-1); }
.code-pill { display: grid; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-md); padding: var(--space-2) var(--space-4); }
.code-pill__k { font-weight: 800; font-size: 13px; letter-spacing: 0.04em; color: var(--ink-muted); }
.code-pill__v { font-weight: 800; }
.upsell { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-3) var(--space-6); background: var(--sunshine-soft); border-radius: var(--radius-lg); padding: var(--space-4) var(--space-6); }
.upsell > div { display: grid; min-width: 0; flex: 1 1 260px; }
.upsell span { color: var(--ink-muted); font-weight: 600; font-size: 14px; }
.vol-grid { display: grid; gap: var(--space-4); grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); }
@media (max-width: 560px) { .vol-art { aspect-ratio: 1; } .vol-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-3); } .vol-title { font-size: 18px; } .vol-body { padding: var(--space-2) var(--space-3) var(--space-3); } .vol-num { font-size: 16px; } .vol-lock { width: 32px; height: 32px; } .vol-chip { font-size: 13px; } }
.vol-card { display: grid; grid-template-rows: auto 1fr; padding: 0; border: 0; border-radius: var(--radius-lg); overflow: hidden; background: var(--paper); box-shadow: var(--shadow-lift); cursor: pointer; text-align: left; font: inherit; color: var(--ink); outline-offset: 3px; }
.vol-card:active { transform: translateY(4px); box-shadow: none; }
.vol-art { position: relative; display: grid; place-items: center; aspect-ratio: 16 / 10; background: var(--sunshine); }
.vol-card.is-locked .vol-art, .vol-card.is-soon .vol-art { background: var(--sunshine-soft); }
.vol-art { overflow: hidden; }
.vol-thumb { position: absolute; left: 50%; top: 54%; transform: translate(-50%, -50%); width: 86%; height: 80%; max-width: none; object-fit: contain; }
.vol-num { position: absolute; left: var(--space-3); top: var(--space-3); background: var(--paper); color: var(--ink); font-family: var(--font-display); font-size: 20px; border-radius: var(--radius-round); padding: 2px var(--space-3); }
.vol-lock { position: absolute; right: var(--space-3); top: var(--space-3); display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--ink); color: var(--paper); }
.vol-lock svg, .vol-chip svg, .lock-ic svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.vol-body { display: grid; gap: 2px; align-content: start; padding: var(--space-3) var(--space-4) var(--space-4); }
.vol-title { font-family: var(--font-display); font-size: 22px; line-height: 1.15; }
.vol-theme { color: var(--ink-muted); font-weight: 600; font-size: 14px; }
.vol-chip { justify-self: start; display: inline-flex; align-items: center; gap: 6px; margin-top: var(--space-2); border-radius: var(--radius-round); padding: 4px var(--space-3); font-weight: 800; font-size: 14px; }
.vol-chip svg { width: 16px; height: 16px; }
.vol-chip--open { background: var(--bibo-blue-deep); color: var(--paper); }
.vol-chip--soon { background: var(--bone); color: var(--ink); }
.vol-chip--locked { background: var(--ink); color: var(--paper); }
.vol-card.is-locked .vol-title, .vol-card.is-locked .vol-theme { color: var(--ink-muted); }

/* Dialog volume terkunci */
.lock-card { background: var(--cream); border-radius: var(--radius-xl); padding: var(--space-6); display: grid; gap: var(--space-3); width: 100%; max-width: 440px; max-height: 100%; overflow: auto; }
.lock-ic { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 50%; background: var(--ink); color: var(--paper); }
.lock-card h2 { font-size: 26px; line-height: 1.15; }
.buy-opts { display: grid; gap: var(--space-2); }
.buy-opt { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 0 var(--space-3); text-align: left; min-height: var(--tap-parent); padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); border: 2px solid var(--line); background: var(--paper); font: inherit; color: var(--ink); cursor: pointer; }
.buy-opt span { font-weight: 800; }
.buy-opt small { grid-column: 1 / -1; color: var(--leaf); font-weight: 800; }
.buy-opt--best { border-color: var(--bibo-blue-deep); }
.inst-steps { margin: 0; padding-left: 1.4em; display: grid; gap: var(--space-2); line-height: 1.45; }
.lock-card > img { width: 96px; height: auto; justify-self: center; }
.lock-actions { display: flex; flex-wrap: wrap; gap: var(--space-2); justify-content: flex-end; }

/* ---------- Beranda ---------- */
.stack { display: grid; gap: var(--space-8); }
.cover { background: var(--sunshine); border-radius: var(--radius-xl); padding: var(--space-6); display: grid; gap: var(--space-4); overflow: hidden; }
.cover .series { font-family: var(--font-display); font-size: 16px; color: var(--bibo-blue-deep); }
.cover h1 { font-size: 40px; line-height: 1.05; color: var(--ink); }
.cover .sub { font-weight: 800; color: var(--ink); }
.arch { background: var(--bone); border-radius: 160px 160px var(--radius-lg) var(--radius-lg); padding: var(--space-8) var(--space-6) var(--space-6); display: grid; gap: var(--space-3); justify-items: center; text-align: center; }
.arch h2 { font-size: clamp(36px, 10vw, 56px); line-height: 1; color: var(--terracotta); }
.arch .tr { font-weight: 700; color: var(--ink-muted); }
.say-row { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; justify-content: center; }
.greet { display: flex; gap: var(--space-4); align-items: center; background: var(--paper); border-radius: var(--radius-lg); padding: var(--space-4); border: 1px solid var(--line); }
.greet .greet-text { display: grid; gap: var(--space-1); min-width: 0; }
.greet .greet-text .en { font-family: var(--font-reader); font-size: 22px; line-height: 1.3; }
.greet .greet-text .id { font-size: 14px; font-weight: 600; color: var(--ink-muted); }
.greet .bibo, .greet .bibo-fallback { width: 96px; height: auto; flex: none; }
.greet .bibo-fallback { height: 96px; font-size: 22px; }
.section-head { display: grid; gap: var(--space-1); }
.section-head h2 { font-size: 28px; line-height: 1.1; }
.section-head p { color: var(--ink-muted); }
.sched-note { display: inline-block; justify-self: start; font-size: 14px; font-weight: 700; color: var(--ink); background: var(--sunshine-soft); border-radius: var(--radius-sm); padding: var(--space-1) var(--space-3); }
.prep { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: var(--space-6); display: grid; gap: var(--space-6); }
.prep-cols { display: grid; gap: var(--space-6); grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.prep h3 { font-family: var(--font-ui); font-weight: 800; font-size: 16px; margin-bottom: var(--space-2); }
.checklist { list-style: none; padding: 0; margin: 0; display: grid; gap: var(--space-1); }
.checklist label { display: flex; align-items: center; gap: var(--space-3); min-height: var(--tap-parent); cursor: pointer; }
.checklist input { width: 24px; height: 24px; accent-color: var(--leaf); flex: none; }
.sessions { display: grid; gap: var(--space-6); }
.session { display: grid; gap: var(--space-3); }
.session-h { font-family: var(--font-ui); font-weight: 800; font-size: 15px; color: var(--ink); display: flex; align-items: center; gap: var(--space-2); }
.session-h::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.days { display: grid; gap: var(--space-4); grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); }
.day-card { display: grid; gap: var(--space-3); align-content: start; text-align: left; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: var(--space-4); cursor: pointer; font: inherit; color: inherit; box-shadow: var(--shadow-lift); min-height: var(--tap-parent); }
.day-card:active { transform: translateY(4px); box-shadow: none; }
.day-card .bb-label { font-size: 20px; justify-self: start; }
.day-card .desc { color: var(--ink); }

/* ---------- Halaman bagian ---------- */
.day-head { display: grid; gap: var(--space-1); margin-bottom: var(--space-4); }
.day-head .daynum { font-weight: 800; font-size: 14px; color: var(--ink-muted); letter-spacing: 0.04em; }
.day-head h1 { font-size: 28px; line-height: 1.1; }
.rotate-tip { display: none; align-items: center; gap: var(--space-3); background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); margin-bottom: var(--space-4); font-size: 14px; font-weight: 700; }
.rotate-tip svg { width: 28px; height: 28px; flex: none; fill: none; stroke: var(--bibo-blue-deep); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
@media (orientation: portrait) and (max-width: 599px) { .rotate-tip { display: flex; } }

.day-layout { display: grid; gap: var(--space-6); align-items: start; }
.stage-col { display: grid; gap: var(--space-4); min-width: 0; }
.stage { background: var(--sunshine); border-radius: var(--radius-xl); padding: var(--space-4); display: grid; gap: var(--space-4); min-width: 0; }
.stage-top { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
.stage-top .stage-back { order: -2; }
.stage-top .bb-label { order: -1; }
.stage-top .count { margin-left: auto; font-weight: 800; color: var(--ink); font-size: 14px; }
.stage-tools { display: flex; gap: var(--space-2); flex: none; }
.stage-tools .bb-btn, .stage-top .count { white-space: nowrap; }
.stage-back { display: none; }
.guide-btn { display: none; }
/* Slide dirancang di ukuran tetap 720x405 lalu diskalakan agar pas di layar (seperti slide presentasi). Di layar sempit (<480px) slide tampil apa adanya. */
.slide-frame { position: relative; width: 100%; min-width: 0; justify-self: center; overflow: hidden; }
.slide-scale { container-type: inline-size; container-name: slide; width: 720px; transform-origin: 0 0; }
.slide-frame.natural { overflow: visible; }
.slide-frame.natural .slide-scale { width: auto; transform: none !important; margin-left: 0 !important; }
.slide { display: grid; gap: max(16px, 2cqw); min-height: 300px; align-content: start; }
.slide-nav { display: flex; justify-content: space-between; gap: var(--space-3); }
.slide-nav .bb-btn { flex: 1 1 0; max-width: 320px; }
.session-done { order: 5; flex: 1 1 100%; background: var(--paper); color: var(--ink); border-radius: var(--radius-round); padding: var(--space-2) var(--space-4); font-weight: 800; font-size: 15px; text-align: center; box-shadow: 0 0 0 3px var(--leaf); }
.session-done b { color: var(--leaf); }
.after { display: grid; gap: var(--space-3); }
.section-pager { display: flex; justify-content: space-between; gap: var(--space-3); flex-wrap: wrap; }

/* ---------- Isi slide (diskalakan dengan cqw) ---------- */
.slide .bb-audio { width: max(var(--tap-kid), 7cqw); height: max(var(--tap-kid), 7cqw); border-width: max(4px, 0.45cqw); }
.slide .bb-audio--xl { width: max(88px, 10cqw); height: max(88px, 10cqw); border-width: max(6px, 0.6cqw); }
.slide .bb-wordcard { padding: max(12px, 1.2cqw); gap: max(8px, 1cqw); border-radius: max(24px, 2.4cqw); }
.slide .bb-wordcard__img { border-radius: max(16px, 1.6cqw); }
.slide .bb-wordcard__word { font-size: max(26px, 3.4cqw); }
.slide .bb-wordcard__word.is-long { font-size: max(18px, 2.4cqw); }
.slide .ph { font-size: max(12px, 1.25cqw); }
.kid-q { display: flex; align-items: center; gap: max(12px, 1.4cqw); }
.kid-q .t { display: grid; min-width: 0; }
.kid-q .en { font-family: var(--font-reader); font-size: max(22px, 3.2cqw); line-height: 1.25; color: var(--ink); }
.kid-q .id { font-size: max(14px, 1.5cqw); font-weight: 700; color: var(--ink-muted); }

.opener { display: grid; justify-items: center; gap: max(16px, 1.6cqw); text-align: center; padding-block: var(--space-4); }
.opener h2 { font-size: max(34px, 6.4cqw); line-height: 1.02; color: var(--ink); }
.opener .tr { font-weight: 700; font-size: max(16px, 1.9cqw); color: var(--ink-muted); }
.opener .bibo { width: max(120px, 20cqw); }
.opener .bibo-fallback { width: max(120px, 18cqw); height: max(120px, 18cqw); }

/* Scene bagian A */
.scene-layout { display: grid; gap: max(16px, 2cqw); }
.scene-main { display: grid; gap: max(12px, 1.4cqw); min-width: 0; }
.scene-pic { position: relative; width: 100%; max-width: 100%; aspect-ratio: 1670 / 942; border-radius: max(20px, 2.4cqw); overflow: hidden; background: var(--paper); }
.scene-pic .scene-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.spot { position: absolute; padding: 0; margin: 0; border: 0; background: transparent; border-radius: max(12px, 1.4cqw); cursor: pointer; }
.spot:hover, .spot:focus-visible { box-shadow: 0 0 0 3px var(--paper), 0 0 0 6px var(--bibo-blue-deep); outline: none; }
/* Panah penunjuk: ujung panah tepat di titik ax,ay; area ketuk 44px di sekitarnya */
.spot-arrow { position: absolute; display: grid; place-items: center; width: max(44px, 3.6cqw); height: max(44px, 4.2cqw); color: var(--bibo-blue-deep); }
.spot-arrow--down { transform: translate(-50%, -100%); place-items: end center; }
.spot-arrow--right { transform: translate(-100%, -50%); place-items: center end; }
.spot-arrow--up { transform: translate(-50%, 0); place-items: start center; }
.spot-arrow svg { width: max(22px, 2.4cqw); height: auto; fill: currentColor; stroke: var(--paper); stroke-width: 2.5; stroke-linejoin: round; paint-order: stroke; filter: drop-shadow(0 2px 0 rgba(30, 27, 24, 0.18)); animation: nudge-down 1.4s ease-in-out infinite; }
.spot-arrow--right svg { transform: rotate(-90deg); animation-name: nudge-right; }
.spot-arrow--up svg { transform: rotate(180deg); animation-name: nudge-up; }
.spot[aria-pressed="true"] .spot-arrow { color: var(--bibo-blue); }
.spot.heard .spot-arrow { color: var(--leaf); }
@keyframes nudge-down { 0%,100% { translate: 0 0; } 50% { translate: 0 -4px; } }
@keyframes nudge-right { 0%,100% { translate: 0 0; } 50% { translate: -4px 0; } }
@keyframes nudge-up { 0%,100% { translate: 0 0; } 50% { translate: 0 4px; } }
.focus-ring { position: absolute; border-radius: 50%; border: max(2px, 0.2cqw) solid var(--bibo-blue-deep); box-shadow: 0 0 0 max(1.5px, 0.12cqw) var(--paper); pointer-events: none; }
.reveal { display: grid; grid-template-columns: minmax(96px, 130px) minmax(0, 1fr); gap: max(16px, 1.6cqw); align-items: center; background: var(--sunshine-soft); border-radius: max(24px, 2.4cqw); padding: max(12px, 1.2cqw); }
.reveal .info { display: grid; gap: max(8px, 1cqw); min-width: 0; }
.reveal .info .id { font-weight: 700; font-size: max(15px, 1.6cqw); color: var(--ink-muted); }
.reveal-empty { color: var(--ink); font-weight: 700; font-size: max(16px, 1.8cqw); text-align: center; padding: max(16px, 2cqw); background: var(--sunshine-soft); border-radius: max(24px, 2.4cqw); }

/* Game bagian B */
.game-layout { display: grid; gap: max(16px, 1.8cqw); }
.game-side { display: grid; gap: max(12px, 1.4cqw); align-content: start; }
.game-top { display: flex; align-items: center; gap: max(16px, 1.6cqw); }
.game-top .bibo, .game-top .bibo-fallback { width: max(84px, 10cqw); height: auto; flex: none; }
.game-top .bibo-fallback { height: max(84px, 10cqw); font-size: 20px; }
.cheer-bubble { background: var(--paper); border-radius: max(24px, 2.4cqw); padding: max(8px, 0.8cqw) max(16px, 1.6cqw); font-family: var(--font-display); font-size: max(22px, 2.7cqw); color: var(--ink); min-width: 0; }
.cheer-bubble small { display: block; font-family: var(--font-ui); font-size: max(13px, 1.3cqw); color: var(--ink-muted); }
.cheer-bubble.ok { color: var(--leaf); }
.cheer-bubble.retry { color: var(--terracotta-deep); }
.cheering { animation: hop 0.6s ease 2; }
@keyframes hop { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-18px); } }
.listen-big { display: flex; align-items: center; gap: max(16px, 1.6cqw); justify-content: center; }
.listen-big .lbl { font-family: var(--font-display); font-size: max(24px, 3cqw); color: var(--ink); }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: max(16px, 1.6cqw); }
.shake { animation: shake 0.45s ease; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.round-dots { display: flex; gap: max(8px, 0.8cqw); justify-content: center; }
.round-dots span { width: max(14px, 1.4cqw); height: max(14px, 1.4cqw); border-radius: 50%; background: var(--paper); border: 2px solid var(--ink); }
.round-dots span.done { background: var(--leaf); border-color: var(--leaf); }
.round-dots span.now { background: var(--bibo-blue-deep); border-color: var(--bibo-blue-deep); }
.game-end { display: grid; justify-items: center; gap: max(12px, 1.4cqw); text-align: center; padding-block: var(--space-4); }
.game-end h2 { font-size: max(44px, 6cqw); color: var(--ink); }
.game-end p { font-weight: 700; font-size: max(16px, 1.8cqw); }
.game-end .bibo { width: max(120px, 16cqw); }
.game-end .bb-btn--kid { min-height: max(64px, 7cqw); font-size: max(24px, 2.6cqw); padding: 0 max(24px, 3cqw); }
.print-cta { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; justify-content: space-between; background: var(--paper); border-radius: var(--radius-lg); padding: var(--space-4); border: 1px solid var(--line); }
.print-cta p { min-width: 0; flex: 1 1 200px; }

/* Video bagian C */
.video-wrap { display: grid; justify-items: center; }
.video { width: 100%; aspect-ratio: 16 / 9; max-width: 100%; border-radius: max(24px, 2.4cqw); background: var(--ink); color: var(--paper); display: grid; place-items: center; text-align: center; padding: var(--space-4); text-decoration: none; box-shadow: var(--shadow-lift); }
.video:hover .play, .video:focus-visible .play { transform: scale(1.06); }
.video:active { transform: translateY(4px); box-shadow: none; }
.video .play { transition: transform 0.15s ease; }
.video .vt { font-weight: 800; font-size: max(17px, 2.2cqw); }
.video .inner { display: grid; gap: max(8px, 1cqw); justify-items: center; }
.video .play { width: max(72px, 9cqw); height: max(72px, 9cqw); border-radius: 50%; background: var(--paper); display: grid; place-items: center; }
.video .play svg { width: 42%; height: 42%; fill: var(--ink); margin-left: 6%; }
.video p { font-weight: 700; font-size: max(16px, 2cqw); }
.video small { color: var(--bone); font-size: max(13px, 1.3cqw); }

/* Cerita bergambar bagian C */
.story { display: grid; gap: max(8px, 1cqw); justify-items: center; }
.story-pic { position: relative; width: 100%; max-width: 100%; aspect-ratio: var(--ratio); border-radius: max(20px, 2.4cqw); overflow: hidden; background: var(--paper); }
.story-pic .story-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.bubble { position: absolute; display: grid; gap: 1px; justify-items: start; text-align: left; padding: max(6px, 0.7cqw) max(10px, 1.1cqw); background: var(--paper); color: var(--ink); border: 2px solid var(--ink); border-radius: max(14px, 1.6cqw); box-shadow: 0 3px 0 rgba(30, 27, 24, 0.18); cursor: pointer; font: inherit; min-height: 44px; }
.bubble::after { content: ""; position: absolute; bottom: calc(-1 * max(11px, 1.2cqw)); width: max(16px, 1.8cqw); height: max(12px, 1.3cqw); background: var(--paper); border: 2px solid var(--ink); border-top: 0; display: none; }
.bubble--bl::after { display: block; left: 18%; border-left: 0; clip-path: polygon(0 0, 100% 0, 0 100%); border-right: 2px solid var(--ink); transform: skewX(-20deg); }
.bubble--br::after { display: block; right: 18%; border-right: 0; clip-path: polygon(0 0, 100% 0, 100% 100%); border-left: 2px solid var(--ink); transform: skewX(20deg); }
.bubble-who { font-size: max(11px, 1.15cqw); font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-muted); }
.bubble-who--kiki { color: var(--leaf); }
.bubble-who--nara { color: var(--terracotta-deep); }
.bubble-who--bibo { color: var(--bibo-blue-deep); }
.bubble-en { font-family: var(--font-reader); font-weight: 700; font-size: max(15px, 2.1cqw); line-height: 1.2; }
.bubble-id { font-size: max(11px, 1.2cqw); font-weight: 600; color: var(--ink-muted); line-height: 1.25; }
.bubble.is-speaking { border-color: var(--bibo-blue-deep); box-shadow: 0 0 0 3px var(--sky); }
.bubble.is-hidden { visibility: hidden; }
.bubble-num { position: absolute; top: calc(-1 * max(9px, 1cqw)); left: calc(-1 * max(9px, 1cqw)); display: grid; place-items: center; width: max(22px, 2.4cqw); height: max(22px, 2.4cqw); border-radius: 50%; background: var(--bibo-blue-deep); color: var(--paper); font-weight: 800; font-size: max(12px, 1.3cqw); line-height: 1; border: 2px solid var(--paper); }
.story-hint { font-size: max(12px, 1.25cqw); font-weight: 600; color: var(--ink-muted); }
@media (prefers-reduced-motion: no-preference) { .bubble.is-shown { animation: bubble-in .28s ease-out; } }
@keyframes bubble-in { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
.bubble:focus-visible { outline: 3px solid var(--bibo-blue-deep); outline-offset: 2px; }
.story-bar { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; justify-content: center; }
.story-page { font-weight: 800; font-size: max(13px, 1.4cqw); color: var(--ink); }
.ic-play { width: 14px; height: 14px; fill: currentColor; }
/* Slide 16:9 kecil (HP landscape, tablet tegak): balon kata jadi daftar di samping gambar */
@container slide (min-width: 480px) and (max-width: 600px) {
  .story-pic { aspect-ratio: auto; overflow: visible; background: transparent; border-radius: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); grid-auto-rows: min-content; align-content: safe center; column-gap: 10px; row-gap: 5px; width: 100%; }
  .story-pic .story-img { position: static; grid-column: 1; grid-row: 1 / span 4; height: calc(56.25cqw - 2cqw - 56px); width: auto; max-width: 58cqw; aspect-ratio: var(--ratio); object-fit: cover; border-radius: 16px; }
  .bubble { position: relative; left: auto !important; top: auto !important; bottom: auto !important; grid-column: 2; width: auto !important; padding: 4px 10px; min-height: 0; }
  .bubble::after { display: none !important; }
  .bubble-en { font-size: 15px; }
  .bubble-id { font-size: 11px; }
  .bubble-who { font-size: 10px; }
}
/* Slide sempit (HP tegak): balon kata pindah ke bawah gambar supaya tidak menutupi wajah */
@container slide (max-width: 479px) {
  .story-pic { aspect-ratio: auto; overflow: visible; background: transparent; display: grid; gap: 10px; border-radius: 0; }
  .story-pic .story-img { position: static; width: 100%; height: auto; aspect-ratio: var(--ratio); border-radius: 20px; }
  .bubble { position: relative; left: auto !important; top: auto !important; bottom: auto !important; width: auto !important; }
  .bubble::after { display: none !important; }
}

/* Kartu (rekap, eksplorasi) */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 140px), 1fr)); gap: max(16px, 1.6cqw); }
.vocab { display: grid; gap: max(8px, 0.8cqw); justify-items: center; }
.vocab .id { font-size: max(13px, 1.4cqw); font-weight: 700; color: var(--ink-muted); }
.vocab-row { display: flex; align-items: center; justify-content: center; gap: max(8px, 0.8cqw); }
.optional { display: inline-flex; justify-self: start; align-items: center; gap: var(--space-2); background: var(--paper); color: var(--ink); font-weight: 800; font-size: max(13px, 1.3cqw); border-radius: var(--radius-round); padding: max(4px, 0.4cqw) max(12px, 1.2cqw); }

/* Game pasangkan bagian D */
.match-wrap { display: grid; gap: max(6px, 0.6cqw); align-content: start; }
.match-head { display: flex; align-items: center; gap: max(10px, 1.2cqw); flex-wrap: wrap; min-height: max(52px, 6.6cqw); }
.match-head .match-bibo { width: max(52px, 7cqw); flex: none; }
.match-board { position: relative; display: grid; grid-template-columns: auto auto; justify-content: space-between; gap: 0 max(60px, 22cqw); width: min(100%, 560px); justify-self: center; }
.match-lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.match-lines path { fill: none; stroke: var(--leaf); stroke-width: 5; stroke-linecap: round; }
.m-col { display: grid; gap: max(6px, 0.8cqw); position: relative; z-index: 1; }
.m-item { display: flex; align-items: center; gap: max(8px, 1cqw); min-height: max(56px, 9cqw); padding: max(4px, 0.5cqw) max(8px, 1cqw); background: var(--paper); border: 3px solid transparent; border-radius: max(16px, 1.8cqw); box-shadow: var(--shadow-lift); cursor: pointer; font: inherit; color: var(--ink); }
.m-item .m-img { height: max(48px, 8cqw); width: max(48px, 8cqw); object-fit: contain; display: block; }
.m-name { font-family: var(--font-reader); font-weight: 700; font-size: max(16px, 2.2cqw); min-width: max(64px, 9cqw); text-align: left; }
.m-dot { width: max(14px, 1.6cqw); height: max(14px, 1.6cqw); border-radius: 50%; background: var(--line); border: 2px solid var(--ink-muted); flex: none; }
.m-item.is-sel { border-color: var(--bibo-blue-deep); box-shadow: 0 0 0 3px var(--sky); }
.m-item.is-sel .m-dot { background: var(--bibo-blue-deep); border-color: var(--bibo-blue-deep); }
.m-item.is-done { border-color: var(--leaf); box-shadow: none; cursor: default; }
.m-item.is-done .m-dot { background: var(--leaf); border-color: var(--leaf); }
.m-item.is-retry { border-color: var(--terracotta-deep); }
.m-item:disabled { color: var(--ink); opacity: 1; }

/* Pola kalimat + penyusun bagian E */
.patterns { display: grid; gap: max(12px, 1.4cqw); grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
.pattern { background: var(--paper); border-radius: max(24px, 2.4cqw); padding: max(12px, 1.2cqw) max(16px, 1.6cqw); display: flex; align-items: center; gap: max(12px, 1.2cqw); }
.pattern .t { display: grid; min-width: 0; }
.pattern .en { font-family: var(--font-reader); font-size: max(22px, 3cqw); line-height: 1.25; }
.pattern .en em { font-style: normal; color: var(--bibo-blue-deep); font-weight: 700; }
.pattern .id { font-size: max(13px, 1.4cqw); font-weight: 700; color: var(--ink-muted); }
.builder { display: grid; gap: max(16px, 1.6cqw); }
.builder-pic { display: grid; grid-template-columns: minmax(0, 1fr); gap: max(16px, 1.6cqw); align-items: center; }
.builder-pic .scene-pic { align-self: center; }
.builder-pic p { font-weight: 700; color: var(--ink); font-size: max(16px, 1.8cqw); }
.builder-pic p span { color: var(--ink-muted); }
.builder-main { display: grid; gap: max(16px, 1.6cqw); align-content: center; min-width: 0; }
.slots { display: flex; flex-wrap: wrap; gap: max(8px, 0.8cqw); min-height: max(76px, 9cqw); align-items: center; background: var(--paper); border-radius: max(24px, 2.4cqw); padding: max(8px, 0.8cqw) max(12px, 1.2cqw); border: 3px dashed var(--ink-muted); }
.slots.done { border: 3px solid var(--leaf); }
.slots .ghost { color: var(--ink-muted); font-weight: 700; font-size: max(15px, 1.6cqw); padding: 0 var(--space-2); }
.chip { min-height: max(var(--tap-kid), 7.5cqw); min-width: max(var(--tap-kid), 7.5cqw); padding: 0 max(24px, 2.6cqw); border-radius: var(--radius-round); border: 0; background: var(--paper); color: var(--ink); box-shadow: var(--shadow-lift), inset 0 0 0 3px var(--bibo-blue-deep); font-family: var(--font-reader); font-weight: 700; font-size: max(28px, 3.4cqw); cursor: pointer; }
.chip:active { transform: translateY(4px); }
.chip.placed { background: var(--sunshine-soft); box-shadow: none; cursor: default; }
.chips { display: flex; flex-wrap: wrap; gap: max(12px, 1.4cqw); justify-content: center; }
.builder-done { display: flex; flex-wrap: wrap; align-items: center; gap: max(12px, 1.4cqw); justify-content: center; }

/* ---------- Panel orang tua ---------- */

/* Mode HP tegak / tablet sempit: panel di bawah, bisa ditutup */

/* Mode laptop/tablet lebar: slide kiri, panel kanan */
[data-mode="docked"] { grid-template-columns: minmax(0, 1fr) var(--panel-w); }

/* Mode HP landscape dan layar penuh: slide memenuhi tinggi, panel lembar geser dari kanan */

[data-mode="overlay"] { display: block; }

[data-mode="overlay"] .session-done { order: 0; flex: 0 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; padding: var(--space-1) var(--space-3); }

.sheet-scrim { display: none; }

/* ---------- Perayaan ---------- */
.celebrate { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }

ra perangkat cukup keras.", "Opsional: cetak flashcard keluarga untuk main di lantai setelah game."], "slides": [{"title": "Pembuka: Listen and choose!", "steps": ["Ketuk tombol putar.", "Jelaskan aturannya dalam bahasa Indonesia: dengarkan Bibo, lalu ketuk gambar yang cocok.", "Lanjut ke slide 2 untuk mulai bermain."], "scripts": [["Listen and choose!", "Dengar, lalu pilih!"]]}, {"title": "Game Dengar, lalu pilih", "steps": ["Ketuk tombol putar besar. Bibo menyebut satu anggota keluarga.", "Ulangi kata itu pelan-pelan untuk anak.", "Anak mengetuk kartu yang cocok.", "Benar: kartu bercincin hijau, Bibo bertepuk tangan, lalu lanjut ke ronde berikutnya.", "Belum tepat: kartu bergoyang dan terdengar \"Try again!\". Dengarkan lagi bersama.", "Ada 5 ronde (titik di atas). Setelah selesai, ketuk \"Main lagi\" atau lanjut.", "Mau main tanpa layar? Ketuk \"Cetak flashcard\" di bawah slide. Di halaman cetak, tekan Ctrl + P (Windows) atau Cmd + P (Mac)."], "scripts": [["Listen! Which one?", "Dengar! Yang mana?"], ["Touch the sister.", "Sentuh saudara perempuan."], ["Try again!", "Coba lagi!"], ["Good job!", "Bagus sekali!"]]}], "planB": "Tukar peran: anak yang menyebut kata, Anda yang memilih kartu. Sesekali sengaja salah, anak biasanya senang mengoreksi.", "age34": "Di versi kartu cetak, pakai 2 kartu saja dulu.", "age56": "Anak menyebut katanya dulu sebelum mengetuk kartu."}, {"hook": {"id": "Eh, ada yang mau datang ke rumah Nara! Kira-kira siapa ya yang mengetuk pintu? Yuk kita baca ceritanya.", "en": "Let's read!", "tr": "Ayo membaca!"}, "goal": "Anak mendengar pola \"Who's she? / Who's he?\" dan kata keluarga di dalam cerita pendek.", "prep": ["Baca ceritanya sendiri sekali sebelum membacakan ke anak.", "Siapkan suara berbeda untuk Kiki dan Nara, supaya anak tahu siapa yang bicara.", "Pastikan internet lancar untuk video di slide 6."], "slides": [{"title": "Pembuka cerita", "steps": ["Ketuk tombol putar. Bibo mengajak membaca cerita.", "Tunjuk judul \"Kiki Visits Nara\" dan jelaskan: Kiki berkunjung ke rumah Nara.", "Tanyakan ke anak: kira-kira siapa saja yang ada di rumah Nara?"], "scripts": [["Let's read a story!", "Ayo membaca cerita!"]]}, {"title": "Halaman 1: Kiki datang", "steps": ["Bacakan balon bernomor 1 dengan suara tokohnya, lalu ketuk balon itu. Balon berikutnya muncul sesuai urutan. Mau lihat semua sekaligus? Ketuk \"Tampilkan semua\".", "Tunjuk Kiki di pintu, lalu Nara.", "Melambai bersama anak sambil menirukan \"Hello!\"."], "scripts": [["Who's this?", "Siapa ini?"], ["Hello!", "Halo!"]]}, {"title": "Halaman 2: Mom dan Baby Tia", "steps": ["Bacakan balon kata sesuai nomornya, ketuk tiap balon untuk lanjut.", "Saat Kiki bertanya \"Who's she?\", tunjuk Mom.", "Tunjuk Baby Tia, lalu mantel biru yang dipegang Nara.", "Ulangi pertanyaannya ke anak sambil menunjuk Mom: \"Who's she?\""], "scripts": [["Who's she?", "Siapa dia (perempuan)?"], ["Where's the baby?", "Di mana bayinya?"]]}, {"title": "Halaman 3: Dad dan Raka", "steps": ["Bacakan balon kata sesuai nomornya, ketuk tiap balon untuk lanjut.", "Saat Kiki bertanya \"Who's he?\", tunjuk Dad.", "Tunjuk topi Dad, lalu Raka yang memakai sepatu.", "Tanyakan ke anak sambil menunjuk Dad: \"Who's he?\""], "scripts": [["Who's he?", "Siapa dia (laki-laki)?"], ["Is this Mom or Dad?", "Ini Mama atau Papa?"]]}, {"title": "Halaman 4: Seluruh keluarga", "steps": ["Bacakan balon kata sesuai nomornya, ketuk tiap balon untuk lanjut.", "Minta anak menunjuk tiap anggota keluarga saat Anda menyebut namanya.", "Ucapkan \"I love my family!\" bersama sambil berpelukan."], "scripts": [["Who's this?", "Siapa ini?"], ["I love my family!", "Aku sayang keluargaku!"]]}, {"title": "Video", "steps": ["Ketuk tombol video. Video terbuka di tab baru (layar penuh akan tertutup).", "Tonton bersama. Jeda di bagian yang menampilkan keluarga, lalu tanyakan salah satu skrip di bawah.", "Setelah selesai, kembali ke tab ini dan lanjut ke slide 7."], "scripts": [["Who's this?", "Siapa ini?"], ["Who's she?", "Siapa dia (perempuan)?"], ["Who's he?", "Siapa dia (laki-laki)?"]]}, {"title": "Rekap: Who did you see?", "steps": ["Ketuk tombol putar di atas. Bibo bertanya \"Who did you see?\".", "Anak menunjuk kartu orang yang tadi muncul di cerita dan video.", "Ketuk tombol putar di bawah tiap kartu untuk mendengar katanya, lalu ucapkan bersama."], "scripts": [["Who did you see?", "Siapa saja yang kamu lihat?"], ["Good job!", "Bagus sekali!"]]}], "planB": "Bacakan saja ceritanya tanpa bertanya. Tanyakan satu pertanyaan setelah cerita selesai.", "age34": "Cukup satu pertanyaan per halaman, anak menjawab dengan menunjuk.", "age56": "Anak menjawab dengan kata dalam bahasa Inggris, lalu menirukan kalimat Nara."}, {"hook": {"id": "Di rumah ada banyak benda seru. Ada topi, ada sepatu… Kira-kira apa lagi ya yang akan kita temukan?", "en": "Let's find out!", "tr": "Ayo cari tahu!"}, "goal": "Anak mengenal kata tambahan: friend, bear, hat, coat, mittens, shoes.", "prep": ["Siapkan benda nyata kalau ada: boneka beruang, topi, jaket, sarung tangan, sepatu.", "Bagian ini opsional. Pilih kata yang paling menarik untuk anak."], "slides": [{"title": "Kosakata: friend, bear, hat", "steps": ["Ketuk tombol putar di bawah tiap kartu.", "Tunjukkan benda nyatanya (boneka beruang, topi) dan sebut namanya.", "Main \"pakai dan sebut\": anak memakai topi sambil menyebut \"hat\"."], "scripts": [["This is my friend, Kiki.", "Ini temanku, Kiki."], ["Put on your hat!", "Pakai topimu!"], ["What's this?", "Ini apa?"]]}, {"title": "Kosakata: coat, mittens, shoes", "steps": ["Ketuk tombol putar di bawah tiap kartu.", "Ambil jaket atau sepatu anak, sebut namanya bersama.", "Main \"pakai dan sebut\": anak memakai jaket atau sepatu sambil menyebut katanya."], "scripts": [["Put on your coat!", "Pakai mantelmu!"], ["Where are your shoes?", "Di mana sepatumu?"]]}, {"title": "Game: Find the shadow!", "steps": ["Tunjuk satu bayangan di kanan dan tanyakan \"What's this?\".", "Anak mengetuk satu gambar di kiri (namanya dibacakan), lalu mengetuk bayangannya di kanan.", "Benar: garis hijau muncul dan bayangan berubah jadi gambar berwarna.", "Belum tepat: kartu bergoyang dan terdengar \"Try again!\".", "Setelah 4 pasang cocok, ketuk \"Main lagi\" atau lanjut."], "scripts": [["Find the shadow!", "Cari bayangannya!"], ["What's this?", "Ini apa?"], ["Good job!", "Bagus sekali!"]]}], "planB": "Cukup 2 kata yang paling menarik buat anak. Sisanya bisa lain waktu.", "age34": "Pakai benda nyata dan 2–3 kata saja. Di game, bantu anak memilih gambar dulu.", "age56": "Keenam kata, ditambah kalimat \"Put on your …!\""}, {"hook": {"id": "Sekarang giliran kamu jadi pemandu! Kita belajar cara memperkenalkan Papa dan Mama. Kira-kira bagaimana ya bilangnya?", "en": "Let's say it!", "tr": "Ayo ucapkan!"}, "goal": "Anak memakai pola \"He's my dad.\" dan \"She's my mom.\"", "prep": ["Siapkan flashcard keluarga atau foto keluarga sendiri."], "slides": [{"title": "Pola kalimat", "steps": ["Ketuk tombol putar di tiap kartu pola.", "Jelaskan dalam bahasa Indonesia: he untuk laki-laki, she untuk perempuan.", "Tunjuk foto keluarga, tanyakan \"Who's he?\" atau \"Who's she?\", lalu bantu anak menjawab dengan polanya."], "scripts": [["Who's he?", "Siapa dia (laki-laki)?"], ["He's my dad.", "Dia papaku."], ["Who's she?", "Siapa dia (perempuan)?"], ["She's my mom.", "Dia mamaku."]]}, {"title": "Susun kalimat", "steps": ["Lihat gambar keluarga. Orang yang dilingkari adalah yang dibicarakan.", "Tanyakan dulu \"Who's he?\" atau \"Who's she?\" sesuai gambar.", "Anak mengetuk kata sesuai urutan. Kalau salah urutan, kata bergoyang dan terdengar \"Try again!\".", "Setelah lengkap, Bibo membacakan kalimatnya. Ucapkan bersama.", "Ketuk \"Lanjut\" untuk kalimat berikutnya. Ada 3 kalimat: dad, mom, baby."], "scripts": [["Who's he?", "Siapa dia (laki-laki)?"], ["He's my dad.", "Dia papaku."], ["This is my baby.", "Ini adik bayiku."]]}], "planB": "Terima jawaban satu kata (\"Dad!\"), lalu Anda lengkapi: \"Yes! He's my dad.\"", "age34": "Anda yang mengetuk kata, anak menirukan kalimatnya.", "age56": "Anak menyusun kalimat sendiri lalu mengucapkannya."}, {"hook": {"id": "Waktunya membuat sesuatu yang spesial! Kita akan membuat hadiah untuk keluarga. Kira-kira apa ya?", "en": "Let's make it!", "tr": "Ayo kita buat!"}, "goal": "Anak membuat bingkai foto keluarga dan memperkenalkan keluarganya dalam bahasa Inggris.", "prep": ["Bahan: karton, gunting, lem, kertas warna, kancing, foto keluarga.", "Siapkan meja dan waktu 20–30 menit.", "Untuk anak 3–4 tahun, gunting dipegang orang tua."], "slides": [{"title": "Bahan dan contoh hasil", "steps": ["Tunjukkan foto contoh hasil bingkai ke anak.", "Kumpulkan bahan bersama. Centang tiap bahan yang sudah siap sambil menyebut namanya."], "scripts": [["Look! A family frame!", "Lihat! Bingkai keluarga!"], ["Let's make it!", "Ayo kita buat!"]]}, {"title": "5 langkah membuat", "steps": ["Ikuti gambar langkah 1 sampai 5 bersama anak.", "Biarkan anak memilih warna kertas dan kancingnya sendiri.", "Tempel foto keluarga di belakang bingkai, lalu tulis \"My Family\" di atasnya."], "scripts": [["Wow! Beautiful!", "Wah! Bagus sekali!"]]}, {"title": "Waktunya tampil!", "steps": ["Lihat contoh Nara menunjukkan bingkainya.", "Latih kalimat tampil satu per satu dengan tombol putar.", "Anak memegang bingkai, menunjuk foto, dan tampil di depan anggota keluarga. Rekam videonya kalau mau.", "Tepuk tangan bersama, lalu ketuk \"Selesai\"."], "scripts": [["Show me your family!", "Tunjukkan keluargamu!"], ["Who's this?", "Siapa ini?"], ["Wow! Beautiful!", "Wah! Bagus sekali!"]]}], "planB": "Anak cukup menunjuk foto sementara Anda yang bicara. Atau anak tampil di depan boneka dulu.", "age34": "Satu kalimat saja: \"This is my mom.\"", "age56": "Tiga kalimat penuh, ditambah nama anggota keluarga."}]

      parent: [{"hook": {"id": "Hari ini kita jadi detektif benda! Di kelas ada banyak barang. Kira-kira apa saja ya?", "en": "Let's look!", "tr": "Ayo lihat!"}, "goal": "Anak mengenal 6 kata benda: book, bag, pencil, crayon, doll, ball.", "prep": ["Duduk berdampingan, layar di depan anak.", "Siapkan beberapa benda nyata (buku, tas, pensil, krayon, boneka, bola) di dekat Anda.", "Bagian ini cukup 5–10 menit."], "slides": [{"title": "Pembuka: What's this?", "steps": ["Ketuk tombol putar. Bibo bertanya \"What's this?\".", "Angkat satu benda nyata, misalnya buku, lalu tanyakan \"What's this?\".", "Biarkan anak menjawab bebas, boleh dalam bahasa Indonesia. Lanjut ke slide 2."], "scripts": [["What's this?", "Ini apa?"]]}, {"title": "Gambar kelas", "steps": ["Ketuk \"Look! What's this?\", lalu tunjuk gambarnya.", "Ketuk panah biru di atas satu benda (atau bendanya langsung). Bibo menyebut katanya dan kartunya muncul di samping.", "Ucapkan lagi kata itu dengan jelas, minta anak menirukan.", "Ketuk tombol putar di kartu untuk mendengar kalimat lengkap, misalnya \"It's a book.\"", "Panah berubah hijau setelah didengar. Lanjutkan sampai keenamnya hijau.", "Main tunjuk: sebut satu benda, anak menunjuknya di gambar.", "Tutup dengan benda nyata: angkat bendanya dan tanya \"What's this?\"."], "scripts": [["Look! What's this? It's a book.", "Lihat! Ini apa? Itu buku."], ["Where's the ball? Point to the ball!", "Di mana bolanya? Tunjuk bolanya!"], ["Good job!", "Bagus sekali!"]]}], "planB": "Jangan paksa anak bicara. Cukup minta anak menunjuk atau mengetuk gambar. Coba lagi lain waktu.", "age34": "Fokus ke 3 kata dulu (book, ball, doll). Anak cukup menunjuk.", "age56": "Anak mengucapkan keenam kata dan menjawab dengan kalimat \"It's a book.\""}, {"hook": {"id": "Sekarang main tebak-tebakan lagi! Bibo akan menyebut nama barang, kamu yang cari gambarnya. Siap dengar baik-baik?", "en": "Let's play!", "tr": "Ayo bermain!"}, "goal": "Anak mengenali kata benda dari suaranya saja.", "prep": ["Atur volume suara perangkat cukup keras.", "Opsional: cetak flashcard benda untuk main di lantai setelah game."], "slides": [{"title": "Pembuka: Listen and choose!", "steps": ["Ketuk tombol putar.", "Jelaskan aturannya dalam bahasa Indonesia: dengarkan Bibo, lalu ketuk gambar yang cocok.", "Lanjut ke slide 2 untuk mulai bermain."], "scripts": [["Listen and choose!", "Dengar, lalu pilih!"]]}, {"title": "Game Dengar, lalu pilih", "steps": ["Ketuk tombol putar besar. Bibo menyebut satu benda.", "Ulangi kata itu pelan-pelan untuk anak.", "Anak mengetuk kartu yang cocok.", "Benar: kartu bercincin hijau, Bibo bertepuk tangan, lalu lanjut ke ronde berikutnya.", "Belum tepat: kartu bergoyang dan terdengar \"Try again!\". Dengarkan lagi bersama.", "Ada 6 ronde (titik di atas). Setelah selesai, ketuk \"Main lagi\" atau lanjut.", "Mau main tanpa layar? Ketuk \"Cetak flashcard\" di bawah slide. Di halaman cetak, tekan Ctrl + P (Windows) atau Cmd + P (Mac)."], "scripts": [["Listen! Which one?", "Dengar! Yang mana?"], ["Touch the crayon.", "Sentuh krayonnya."], ["Try again!", "Coba lagi!"], ["Good job!", "Bagus sekali!"]]}], "planB": "Tukar peran: anak yang menyebut kata, Anda yang memilih kartu. Sesekali sengaja salah, anak biasanya senang mengoreksi.", "age34": "Di versi kartu cetak, pakai 2 kartu saja dulu.", "age56": "Anak menyebut katanya dulu sebelum mengetuk kartu."}, {"hook": {"id": "Wah, bola Raka hilang! Kira-kira ada di mana ya? Yuk kita bantu cari di cerita.", "en": "Let's read!", "tr": "Ayo membaca!"}, "goal": "Anak mendengar pola \"What's this? It's a …\" dan kata benda di dalam cerita pendek.", "prep": ["Baca ceritanya sendiri sekali sebelum membacakan ke anak.", "Siapkan suara berbeda untuk Raka dan Nara, supaya anak tahu siapa yang bicara.", "Pastikan internet lancar untuk video di slide 6."], "slides": [{"title": "Pembuka cerita", "steps": ["Ketuk tombol putar. Bibo mengajak membaca cerita.", "Tunjuk judul \"Where's My Ball?\" dan jelaskan: bola Raka hilang.", "Tanyakan ke anak: kira-kira bolanya di mana ya?"], "scripts": [["Let's read a story!", "Ayo membaca cerita!"]]}, {"title": "Halaman 1: Bola Raka hilang", "steps": ["Bacakan balon bernomor 1 dengan suara tokohnya, lalu ketuk balon itu. Balon berikutnya muncul sesuai urutan. Mau lihat semua sekaligus? Ketuk \"Tampilkan semua\".", "Tunjuk Raka yang sedang bingung, lalu Nara.", "Angkat bahu bersama anak sambil menirukan \"Where's my ball?\"."], "scripts": [["Where's the ball?", "Di mana bolanya?"], ["Let's find it!", "Ayo kita cari!"]]}, {"title": "Halaman 2: Tas Raka", "steps": ["Bacakan balon kata sesuai nomornya, ketuk tiap balon untuk lanjut.", "Saat Nara bertanya \"What's this?\", tunjuk tasnya.", "Ulangi pertanyaannya ke anak sambil menunjuk tas: \"What's this?\""], "scripts": [["What's this?", "Ini apa?"], ["It's a bag.", "Itu tas."]]}, {"title": "Halaman 3: Boneka dan teddy bear", "steps": ["Bacakan balon kata sesuai nomornya, ketuk tiap balon untuk lanjut.", "Tunjuk bonekanya, lalu teddy bear yang sudah tua.", "Tanyakan sambil menunjuk teddy bear: \"Is it old or new?\""], "scripts": [["What's this?", "Ini apa?"], ["Is it old or new?", "Ini lama atau baru?"]]}, {"title": "Halaman 4: Bolanya ketemu!", "steps": ["Bacakan balon kata sesuai nomornya, ketuk tiap balon untuk lanjut.", "Tunjuk pintu, lalu bola di baliknya.", "Bersorak bersama anak: \"It's my ball!\"."], "scripts": [["Find the ball!", "Cari bolanya!"], ["Yay! It's the ball!", "Hore! Itu bolanya!"]]}, {"title": "Video", "steps": ["Ketuk tombol video. Video terbuka di tab baru (layar penuh akan tertutup).", "Tonton bersama. Jeda saat sebuah benda muncul, tunjuk bendanya, lalu tanyakan \"What's this?\".", "Setelah selesai, kembali ke tab ini dan lanjut ke slide 7."], "scripts": [["What's this?", "Ini apa?"], ["It's a ball.", "Itu bola."]]}, {"title": "Rekap: What did you see?", "steps": ["Ketuk tombol putar di atas. Bibo bertanya \"What did you see?\".", "Anak menunjuk kartu benda yang tadi muncul di cerita.", "Ketuk tombol putar di bawah tiap kartu untuk mendengar katanya, lalu ucapkan bersama."], "scripts": [["What did you see?", "Apa saja yang kamu lihat?"], ["Good job!", "Bagus sekali!"]]}], "planB": "Bacakan saja ceritanya tanpa bertanya. Tanyakan satu pertanyaan setelah cerita selesai.", "age34": "Cukup satu pertanyaan per halaman, anak menjawab dengan menunjuk.", "age56": "Anak menjawab dengan kalimat \"It's a …\", lalu menirukan kalimat Raka."}, {"hook": {"id": "Ada benda-benda baru yang mau kita kenal. Ada yang bisa berlayar, ada yang bisa terbang… Kira-kira apa ya?", "en": "Let's find out!", "tr": "Ayo cari tahu!"}, "goal": "Anak mengenal kata tambahan: boat, teddy bear, bees, doors, old, new.", "prep": ["Siapkan benda nyata kalau ada: mainan perahu, boneka beruang, satu barang lama dan satu barang baru.", "Bagian ini opsional. Pilih kata yang paling menarik untuk anak."], "slides": [{"title": "Kosakata: boat, teddy bear, bees", "steps": ["Ketuk tombol putar di bawah tiap kartu.", "Tunjukkan benda nyatanya (mainan perahu, boneka beruang) dan sebut namanya.", "Tirukan suara lebah \"bzzz\" sambil menyebut \"bees\"."], "scripts": [["What's this? It's a boat.", "Ini apa? Itu perahu."], ["Find the teddy bear!", "Cari boneka beruangnya!"]]}, {"title": "Kosakata: doors, old, new", "steps": ["Ketuk tombol putar di bawah tiap kartu.", "Ketuk pintu kamar bersama anak sambil menyebut \"door\".", "Tunjukkan satu barang lama dan satu barang baru, lalu tanyakan \"Is it old or new?\"."], "scripts": [["Knock on the door!", "Ketuk pintunya!"], ["It's old. It's new.", "Ini lama. Ini baru."]]}, {"title": "Game: Find the shadow!", "steps": ["Tunjuk satu bayangan di kanan dan tanyakan \"What's this?\".", "Anak mengetuk satu gambar di kiri (namanya dibacakan), lalu mengetuk bayangannya di kanan.", "Benar: garis hijau muncul dan bayangan berubah jadi gambar berwarna.", "Belum tepat: kartu bergoyang dan terdengar \"Try again!\".", "Setelah 4 pasang cocok, ketuk \"Main lagi\" atau lanjut."], "scripts": [["Find the shadow!", "Cari bayangannya!"], ["What's this?", "Ini apa?"], ["Good job!", "Bagus sekali!"]]}], "planB": "Cukup 2 kata yang paling menarik buat anak. Sisanya bisa lain waktu.", "age34": "Pakai benda nyata dan 2–3 kata saja. Di game, bantu anak memilih gambar dulu.", "age56": "Keenam kata, ditambah kalimat \"It's old.\" dan \"It's new.\""}, {"hook": {"id": "Sekarang kamu yang jadi penjual mainan! Kita belajar cara menyebut barang. Kira-kira bagaimana ya bilangnya?", "en": "Let's say it!", "tr": "Ayo ucapkan!"}, "goal": "Anak memakai pola \"What's this? It's a …\", \"Find the …\" dan \"This is my …\".", "prep": ["Siapkan 3–4 benda nyata milik anak (bola, buku, tas)."], "slides": [{"title": "Pola kalimat", "steps": ["Ketuk tombol putar di tiap kartu pola.", "Main toko-tokoan: Anda memegang benda dan bertanya \"What's this?\", anak menjawab \"It's a …\".", "Ganti peran: anak yang bertanya, Anda yang menjawab."], "scripts": [["What's this?", "Ini apa?"], ["It's a crayon.", "Itu krayon."], ["This is my ball.", "Ini bolaku."]]}, {"title": "Susun kalimat", "steps": ["Lihat gambar kelas. Benda yang dilingkari adalah yang dibicarakan.", "Tanyakan dulu \"What's this?\" sambil menunjuk benda yang dilingkari.", "Anak mengetuk kata sesuai urutan. Kalau salah urutan, kata bergoyang dan terdengar \"Try again!\".", "Setelah lengkap, Bibo membacakan kalimatnya. Ucapkan bersama.", "Ketuk \"Lanjut\" untuk kalimat berikutnya. Ada 3 kalimat: crayon, bag, ball."], "scripts": [["What's this?", "Ini apa?"], ["It's a crayon.", "Itu krayon."], ["Find the ball.", "Cari bolanya."]]}], "planB": "Terima jawaban satu kata (\"Ball!\"), lalu Anda lengkapi: \"Yes! It's a ball.\"", "age34": "Anda yang mengetuk kata, anak menirukan kalimatnya.", "age56": "Anak menyusun kalimat sendiri lalu mengucapkannya."}, {"hook": {"id": "Waktunya membuat tempat rahasia untuk benda kesayanganmu! Kira-kira apa ya yang akan kita buat?", "en": "Let's make it!", "tr": "Ayo kita buat!"}, "goal": "Anak membuat kotak harta karun dan memperkenalkan benda favoritnya dalam bahasa Inggris.", "prep": ["Bahan: kotak bekas (kotak sepatu atau kardus kecil), kertas warna, lem, gunting, krayon atau stiker, 3 benda favorit anak.", "Siapkan meja dan waktu 20–30 menit.", "Untuk anak 3–4 tahun, gunting dipegang orang tua."], "slides": [{"title": "Bahan dan contoh hasil", "steps": ["Tunjukkan contoh hasil kotak harta karun ke anak.", "Kumpulkan bahan bersama. Centang tiap bahan yang sudah siap sambil menyebut namanya.", "Minta anak memilih 3 benda favorit untuk disimpan di kotak."], "scripts": [["Look! A treasure box!", "Lihat! Kotak harta karun!"], ["Let's make it!", "Ayo kita buat!"]]}, {"title": "5 langkah membuat", "steps": ["Ikuti gambar langkah 1 sampai 5 bersama anak.", "Biarkan anak memilih warna kertas dan hiasannya sendiri.", "Kalau mau, tulis \"My Treasure Box\" di tutup kotak."], "scripts": [["Wow! Beautiful!", "Wah! Bagus sekali!"]]}, {"title": "Waktunya tampil!", "steps": ["Lihat contoh Raka menunjukkan kotak harta karunnya.", "Latih kalimat tampil satu per satu dengan tombol putar.", "Anak membuka kotaknya, mengeluarkan benda satu per satu, dan memperkenalkannya di depan anggota keluarga. Rekam videonya kalau mau.", "Tepuk tangan bersama, lalu ketuk \"Selesai\"."], "scripts": [["What's in your box?", "Ada apa di kotakmu?"], ["What's this?", "Ini apa?"], ["Wow! Beautiful!", "Wah! Bagus sekali!"]]}], "planB": "Anak cukup mengeluarkan benda sementara Anda yang bicara. Atau anak tampil di depan boneka dulu.", "age34": "Satu kalimat saja: \"This is my ball.\"", "age56": "Tiga kalimat penuh, ditambah \"It's old.\" atau \"It's new.\""}]
